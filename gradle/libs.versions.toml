[versions]
accompanist = "0.37.2"
androidGradlePlugin = "8.9.0"
androidxActivity = "1.10.1"
androidxComposeBom = "2025.02.00"
androidxCore = "1.15.0"
androidxEspresso = "3.6.1"
androidxLifecycle = "2.8.7"
androidxNavigation = "2.8.8"
work = "2.10.0"
securityCrypto = "1.1.0-alpha06"

kotlin = "2.1.10"
ktor = "3.1.2"
compose = "1.7.8"
ksp = "2.1.10-1.0.29"
kotlinxCoroutines = "1.10.1"
kotlinxSerializationJson = "1.8.0"

junit4 = "4.13.2"
dependencyGuard = "0.5.0"
secretsGradlePlugin = "2.0.1"

# Map-related dependencies
maplibreAndroidSdk = "11.8.2"
maplibreCompose = "0.6.0"
maplibreAndroidPlugins = "3.0.2"

spatialk = "0.3.0"
playServicesLocation = "21.3.0"
geojson = "1.0.1"

# Networking and persistence
retrofit = "2.11.0"
converterGson = "2.9.0"
okhttp = "4.12.0"
room = "2.7.0-rc01"

[bundles]
androidx-compose-ui-test = ["androidx-compose-ui-test", "androidx-compose-ui-testManifest"]

[libraries]
# Core Android and Compose
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "compose" }
androidx-compose-ui-testManifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }


# MapLibre Compose modules (assuming dev.sargunv.maplibrecompose)
geojson = { module = "com.cocoahero.android:geojson", version.ref = "geojson" }
maplibre-compose = { group = "dev.sargunv.maplibre-compose", name = "maplibre-compose", version.ref = "maplibreCompose" }
maplibre-composeMaterial3 = { group = "dev.sargunv.maplibre-compose", name = "maplibre-compose-material3", version.ref = "maplibreCompose" }
#maplibre-composeExtensions = { group = "dev.sargunv.maplibre-compose", name = "maplibre-compose-extensions", version.ref = "maplibreCompose" }
maplibre-composeGeojson = { group = "dev.sargunv.maplibre-compose", name = "maplibre-compose-geojson", version.ref = "maplibreCompose" }
maplibre-composeExperimental = { group = "dev.sargunv.maplibre-compose", name = "maplibre-compose-experimental", version.ref = "maplibreCompose" }

maplibre-android-sdk = { module = "org.maplibre.gl:android-sdk", version.ref ="maplibreAndroidSdk" }
maplibre-android-scalebar = { module = "org.maplibre.gl:android-plugin-scalebar-v9", version.ref = "maplibreAndroidPlugins" }
spatialk-geojson = { group = "io.github.dellisd.spatialk", name = "geojson", version.ref = "spatialk" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }


# Lifecycle and Navigation
androidx-lifecycle-runtimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# Testing
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxEspresso" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

# Kotlin extensions
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Networking
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converterGson" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Room
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

# Plugins
secrets-gradle-plugin = { group = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", name = "secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
dependencyGuard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
